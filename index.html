<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מדד הכנסת</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="boot"><div class="in">
  <h1>מדד <em>הכנסת</em></h1>
  <div id="bmsg">טוען את בסיס הנתונים…</div>
  <div id="bbar"><i></i></div>
</div></div>

<div class="wrap">
<header>
  <h1>מדד <em>הכנסת</em></h1>
  <div class="src" id="src">נתונים רשמיים<br>ODATA הכנסת</div>
</header>

<section class="ask">
  <p>איך הצביעה
     <button class="slot" id="s-fac">כל הסיעות</button>
     בנושא
     <button class="slot" id="s-top">כל הנושאים</button>?
  </p>
  <div class="hint" id="hint"></div>
</section>

<section class="time">
  <div class="lab"><span>מ־<b id="d0"></b></span><span>עד <b id="d1"></b></span></div>
  <div class="track">
    <div class="bar"></div><div class="sel" id="sel"></div>
    <input type="range" id="r0"><input type="range" id="r1">
  </div>
  <div class="kn" id="knbar"></div>
</section>

<nav>
  <button aria-selected="true" data-t="answer">תשובה</button>
  <button aria-selected="false" data-t="votes">הצבעות</button>
  <button aria-selected="false" data-t="basket">הסל שלי<span class="b" id="bcount" hidden>0</span></button>
  <button aria-selected="false" data-t="plat">מצעים</button>
  <button aria-selected="false" data-t="people">ח״כים</button>
  <button aria-selected="false" data-t="cand">מועמדים</button>
  <button aria-selected="false" data-t="snap">תמונת מצב</button>
</nav>

<div class="rowline"><span id="count">—</span>
  <select id="sort"></select></div>
<main id="out"></main>
</div>

<div class="sheet" id="sheet"><div class="wrap" id="sheetin"></div></div>
<div class="pick" id="pick">
  <div class="hd"><button class="x" id="pclose">✕</button>
    <input id="psearch" placeholder="חיפוש…"></div>
  <div class="list" id="plist"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="app1.js"></script>
<script src="app2.js"></script>
<script src="app3.js"></script>
<script src="app4.js"></script>
<script src="app5.js"></script>
</body>
</html>
