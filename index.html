<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מדד הכנסת</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;500;700&display=swap');

:root{
  --bg:#0A1628; --panel:#0E1F36; --panel2:#132A47;
  --rule:#1E3A5F; --rule-2:#152C4A;
  --flag:#0038B8; --sky:#5C9DFF; --ice:#DDE9F7; --dim:#7E9CC0;
  --for:#35C08D; --against:#EF5F73; --abstain:#E8B84B; --none:#34506F;
  --pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ice);
  font:400 15px/1.55 'Heebo',system-ui,sans-serif;padding-bottom:72px}
button,input,select{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:var(--sky)}
.n{font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto}

/* ── כותרת ── */
header{border-bottom:1px solid var(--rule);padding:14px var(--pad) 12px;
  display:flex;align-items:baseline;gap:10px}
h1{font:900 22px/1 'Frank Ruhl Libre',serif;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--sky)}
.src{margin-inline-start:auto;font-size:10.5px;color:var(--dim);text-align:end;
  line-height:1.35}

/* ── שאלה ── */
.ask{padding:22px var(--pad) 6px;border-bottom:1px solid var(--rule-2)}
.ask p{font:400 21px/1.75 'Frank Ruhl Libre',serif}
.slot{display:inline-block;border-bottom:2px solid var(--flag);color:#fff;
  padding:0 4px 1px;background:none;font:inherit;cursor:pointer;
  max-width:min(64vw,340px);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:bottom}
.slot:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.ask .hint{font:400 12px/1.5 'Heebo',sans-serif;color:var(--dim);margin-top:12px}

/* ── ציר זמן ── */
.time{padding:14px var(--pad) 18px;border-bottom:1px solid var(--rule)}
.time .lab{display:flex;justify-content:space-between;font-size:12px;
  color:var(--dim);margin-bottom:10px}
.time .lab b{color:var(--ice);font-weight:500}
.track{position:relative;height:34px}
.track .bar{position:absolute;inset-block:15px;inset-inline:0;background:var(--panel2)}
.track .sel{position:absolute;inset-block:15px;background:var(--flag)}
.track input{position:absolute;inset-inline:0;top:0;width:100%;height:34px;
  -webkit-appearance:none;appearance:none;background:none;pointer-events:none}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  background:var(--ice);border:3px solid var(--flag);pointer-events:auto;cursor:grab}
.track input::-moz-range-thumb{width:22px;height:22px;background:var(--ice);
  border:3px solid var(--flag);pointer-events:auto;cursor:grab;border-radius:0}
.kn{display:flex;gap:1px;margin-top:4px}
.kn i{flex:1;height:3px;background:var(--rule)}
.kn i.on{background:var(--sky)}
.kn span{font-size:10px;color:var(--dim)}

/* ── טאבים ── */
nav{display:flex;border-bottom:1px solid var(--rule);position:sticky;top:0;
  background:var(--bg);z-index:20;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;padding:12px 13px;font-size:13.5px;color:var(--dim);
  border-bottom:2px solid transparent;white-space:nowrap}
nav button .b{background:var(--flag);color:#fff;font-size:10.5px;padding:0 5px;
  margin-inline-start:5px}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--flag);
  background:var(--panel)}

/* ── תוכן ── */
main{padding:0 0 20px}
.msg{padding:40px var(--pad);text-align:center;color:var(--dim);font-size:14px}
.rowline{display:flex;align-items:center;gap:8px;padding:10px var(--pad);
  font-size:12px;color:var(--dim);border-bottom:1px solid var(--rule-2)}
.rowline select{margin-inline-start:auto;color:var(--sky);font-size:12px}

/* פילוח סיעות */
.fac{padding:13px var(--pad);border-bottom:1px solid var(--rule-2)}
.fac .top{display:flex;align-items:baseline;gap:8px}
.fac .nm{font:700 16px/1.25 'Frank Ruhl Libre',serif;flex:1}
.fac .tot{font-size:11.5px;color:var(--dim)}
.split{display:flex;height:22px;margin-top:9px}
.split i{position:relative}
.split i.f{background:var(--for)} .split i.a{background:var(--against)}
.split i.b{background:var(--abstain)} .split i.o{background:var(--none)}
.split i span{position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;font-weight:500;color:#06131f}
.legend{display:flex;gap:14px;font-size:11px;color:var(--dim);
  padding:10px var(--pad) 0;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;margin-inline-end:5px;
  vertical-align:-1px}

/* רשימות */
.item{display:block;width:100%;text-align:start;padding:12px var(--pad);
  border-bottom:1px solid var(--rule-2)}
.item:active{background:var(--panel)}
.item .t{font-size:14.5px;line-height:1.4}
.item .s{font-size:11.5px;color:var(--dim);margin-top:4px;
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10.5px;padding:1px 7px;border:1px solid var(--rule);color:var(--dim)}
.pill.co{border-color:#2C6B52;color:#5FD3A6}
.pill.op{border-color:#7A3345;color:#F58EA0}
.pill.f{border-color:#2C6B52;color:var(--for)}
.pill.a{border-color:#7A3345;color:var(--against)}
.pill.on{background:var(--flag);border-color:var(--flag);color:#fff}
.add{width:34px;height:34px;flex:none;border:1px solid var(--rule);
  font-size:17px;color:var(--dim);align-self:flex-start}
.add.on{background:var(--flag);border-color:var(--flag);color:#fff}
.stance{display:flex;gap:6px;margin-top:8px}
.stance button{flex:1;border:1px solid var(--rule);padding:6px;font-size:12px;
  color:var(--dim)}
.stance button.on.f{background:var(--for);border-color:var(--for);color:#06131f}
.stance button.on.a{background:var(--against);border-color:var(--against);color:#fff}
.score{display:flex;align-items:center;gap:10px}
.score .n{font:700 19px 'Frank Ruhl Libre',serif;width:52px;text-align:end}
.mini{display:flex;gap:2px;margin-top:6px}
.mini i{width:11px;height:11px;background:var(--none)}
.mini i.f{background:var(--for)} .mini i.a{background:var(--against)}
.mini i.b{background:var(--abstain)}
.bar{display:flex;height:5px;margin-top:8px;background:var(--panel2)}
.bar i.f{background:var(--for)} .bar i.a{background:var(--against)}

/* גיליון */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;
  display:none}
.sheet.open{display:block}
.sheet .hd{position:sticky;top:0;background:var(--bg);
  border-bottom:1px solid var(--rule);padding:11px var(--pad);
  display:flex;gap:10px;align-items:center}
.sheet .hd b{font:700 16px 'Frank Ruhl Libre',serif;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:34px;height:34px;border:1px solid var(--rule);font-size:17px;flex:none}
.sec{padding:16px var(--pad);border-bottom:1px solid var(--rule-2)}
.sec h3{font:700 11px/1 'Heebo';letter-spacing:.1em;color:var(--sky);
  margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h3::after{content:"";flex:1;height:1px;background:var(--rule-2)}
.hero{display:flex;gap:14px;padding:16px var(--pad);border-bottom:1px solid var(--rule)}
.face{width:74px;height:92px;flex:none;background:var(--panel2);
  border:1px solid var(--rule);object-fit:cover;display:grid;place-items:center;
  font:700 24px 'Frank Ruhl Libre',serif;color:var(--sky)}
.hero h2{font:900 24px/1.1 'Frank Ruhl Libre',serif}
.hero .sub{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.5}
.lnks{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule-2);
  border:1px solid var(--rule-2)}
.cell{background:var(--panel);padding:11px}
.cell .v{font:700 24px/1 'Frank Ruhl Libre',serif}
.cell .k{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.3}
.tl{border-inline-start:1px solid var(--rule);padding-inline-start:14px;
  margin-inline-start:4px}
.tl div{position:relative;padding-bottom:14px}
.tl div::before{content:"";position:absolute;inset-inline-start:-19px;top:5px;
  width:9px;height:9px;background:var(--flag);border:1px solid var(--sky)}
.tl .w{font-size:14px} .tl .d{font-size:11.5px;color:var(--dim);margin-top:2px}
.note{font-size:11px;color:var(--none);line-height:1.6;margin-top:10px}
.txt{font-size:13.5px;line-height:1.7;color:#C3D6EE}

/* בורר */
.pick{position:fixed;inset:0;background:rgba(6,15,28,.94);z-index:80;display:none;
  flex-direction:column}
.pick.open{display:flex}
.pick .hd{padding:12px var(--pad);border-bottom:1px solid var(--rule);
  display:flex;gap:10px;align-items:center}
.pick input{flex:1;background:var(--panel);border:1px solid var(--rule);
  padding:10px 12px;font-size:15px}
.pick .list{overflow-y:auto;flex:1}
.pick .list button{display:block;width:100%;text-align:start;
  padding:12px var(--pad);border-bottom:1px solid var(--rule-2);font-size:14.5px}
.pick .list button small{color:var(--dim);font-size:11.5px}

#boot{position:fixed;inset:0;background:var(--bg);z-index:99;display:grid;
  place-items:center;text-align:center;padding:30px}
#boot .in{max-width:340px}
#boot h1{font-size:26px;margin-bottom:14px}
#bmsg{font-size:13px;color:var(--dim);line-height:1.7}
#bbar{height:3px;background:var(--panel2);margin-top:16px}
#bbar i{display:block;height:100%;width:0;background:var(--flag);
  transition:width .25s}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<div id="boot"><div class="in">
  <h1>מדד <em>הכנסת</em></h1>
  <div id="bmsg">טוען את בסיס הנתונים…</div>
  <div id="bbar"><i></i></div>
</div></div>

<div class="wrap">
<header>
  <h1>מדד <em>הכנסת</em></h1>
  <div class="src" id="src">נתונים רשמיים<br>ODATA הכנסת</div>
</header>

<section class="ask">
  <p>איך הצביעה
     <button class="slot" id="s-fac">כל הסיעות</button>
     בנושא
     <button class="slot" id="s-top">כל הנושאים</button>?
  </p>
  <div class="hint" id="hint"></div>
</section>

<section class="time">
  <div class="lab"><span>מ־<b id="d0"></b></span><span>עד <b id="d1"></b></span></div>
  <div class="track">
    <div class="bar"></div><div class="sel" id="sel"></div>
    <input type="range" id="r0"><input type="range" id="r1">
  </div>
  <div class="kn" id="knbar"></div>
</section>

<nav>
  <button aria-selected="true" data-t="answer">תשובה</button>
  <button aria-selected="false" data-t="votes">הצבעות</button>
  <button aria-selected="false" data-t="basket">הסל שלי<span class="b" id="bcount" hidden>0</span></button>
  <button aria-selected="false" data-t="people">ח״כים</button>
  <button aria-selected="false" data-t="cand">מועמדים</button>
  <button aria-selected="false" data-t="snap">תמונת מצב</button>
</nav>

<div class="rowline"><span id="count">—</span>
  <select id="sort"></select></div>
<main id="out"></main>
</div>

<div class="sheet" id="sheet"><div class="wrap" id="sheetin"></div></div>
<div class="pick" id="pick">
  <div class="hd"><button class="x" id="pclose">✕</button>
    <input id="psearch" placeholder="חיפוש…"></div>
  <div class="list" id="plist"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const bmsg=t=>$("#bmsg").textContent=t, bbar=p=>$("#bbar i").style.width=p+"%";
let DB=null, CAND=null, PEOPLE=null;
const S={tab:"answer",faction:null,topic:null,d0:null,d1:null,sort:"n"};
const SORTS={answer:"n",votes:"d",basket:"m",people:"n",cand:"p",snap:"r"};
// הסל נשמר בין ביקורים. stance = העמדה שהמשתמש/ת סימנ/ה לכל הצבעה.
let BASKET=[], STANCE={};
try{BASKET=JSON.parse(localStorage.knBasket||"[]");
    STANCE=JSON.parse(localStorage.knStance||"{}");}catch(e){}
function saveBasket(){
  try{localStorage.knBasket=JSON.stringify(BASKET);
      localStorage.knStance=JSON.stringify(STANCE);}catch(e){}
  const b=$("#bcount"); b.textContent=BASKET.length; b.hidden=!BASKET.length;
}
const inBasket=id=>BASKET.includes(id);
function toggleBasket(id){
  const i=BASKET.indexOf(id);
  if(i<0) BASKET.push(id); else {BASKET.splice(i,1); delete STANCE[id];}
  saveBasket(); render();
}

/* ─────────── טעינה ─────────── */
async function boot(){
  try{
    bmsg("טוען מנוע…");
    const SQL=await initSqlJs({locateFile:f=>
      "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/"+f});
    bmsg("מוריד את בסיס הנתונים (78MB)…");
    const r=await fetch("knesset_web.db");
    if(!r.ok) throw new Error("knesset_web.db לא נמצא ("+r.status+")");
    const len=+r.headers.get("content-length")||78e6, chunks=[]; let got=0;
    const rd=r.body.getReader();
    for(;;){const {done,value}=await rd.read(); if(done)break;
      chunks.push(value); got+=value.length;
      bbar(Math.min(99,got/len*100));
      bmsg(`מוריד… ${(got/1e6).toFixed(0)} מתוך ${(len/1e6).toFixed(0)} MB`);}
    const buf=new Uint8Array(got); let o=0;
    for(const c of chunks){buf.set(c,o); o+=c.length;}
    bmsg("פותח…"); bbar(100);
    DB=new SQL.Database(buf);
    try{CAND=await (await fetch("candidates.json")).json();}catch(e){}
    try{PEOPLE=await (await fetch("people_index.json")).json();}catch(e){}
    init();
    $("#boot").style.display="none";
  }catch(e){
    bmsg("הטעינה נכשלה: "+e.message+
      "<br><br>ודאי ש-knesset_web.db יושב לצד index.html ושהדף מוגש משרת ולא מהקובץ.");
    $("#bmsg").innerHTML=$("#bmsg").textContent;
  }
}

const q=(sql,p=[])=>{const r=DB.exec(sql,p); if(!r.length)return[];
  return r[0].values.map(v=>Object.fromEntries(r[0].columns.map((c,i)=>[c,v[i]])));};
const one=(sql,p=[])=>{const r=q(sql,p); return r.length?Object.values(r[0])[0]:null;};

/* ─────────── אתחול ─────────── */
let FACS=[], TOPS=[], KN=[], DMIN, DMAX;
function init(){
  DMIN=one("SELECT MIN(date) FROM vote_x WHERE date!=''");
  DMAX=one("SELECT MAX(date) FROM vote_x WHERE date!=''");
  S.d0=DMIN; S.d1=DMAX;
  KN=q("SELECT knesset k, MIN(date) a, MAX(date) b FROM vote_x WHERE date!='' GROUP BY 1 ORDER BY 1");
  FACS=q(`SELECT m.faction f, COUNT(DISTINCT m.mk_id) n, m.knesset k FROM mk m
          WHERE m.knesset IN (SELECT DISTINCT knesset FROM vote_x)
          GROUP BY m.faction, m.knesset ORDER BY n DESC`);
  TOPS=q(`SELECT t.name f, COUNT(*) n FROM topic_match m JOIN topic t ON t.id=m.topic_id
          WHERE m.kind='vote' GROUP BY 1 ORDER BY n DESC`);
  const built=one("SELECT v FROM meta WHERE k='built'")||"";
  $("#src").innerHTML=`נתונים רשמיים · ODATA הכנסת<br>עודכן ${built}`;
  setupTime(); setupPickers(); setupNav(); render();
}

/* ─────────── ציר זמן ─────────── */
const days=d=>Math.round(new Date(d)/864e5);
const iso=n=>new Date(n*864e5).toISOString().slice(0,10);
function setupTime(){
  const a=days(DMIN), b=days(DMAX);
  const r0=$("#r0"), r1=$("#r1");
  [r0,r1].forEach(r=>{r.min=a; r.max=b; r.step=1;});
  r0.value=a; r1.value=b;
  const upd=()=>{
    let x=+r0.value, y=+r1.value;
    if(x>y){[x,y]=[y,x];}
    S.d0=iso(x); S.d1=iso(y);
    $("#d0").textContent=fmt(S.d0); $("#d1").textContent=fmt(S.d1);
    const L=(x-a)/(b-a)*100, R=(y-a)/(b-a)*100;
    $("#sel").style.insetInlineStart=L+"%"; $("#sel").style.width=(R-L)+"%";
    $("#knbar").innerHTML=KN.map(k=>
      `<i class="${k.b>=S.d0&&k.a<=S.d1?"on":""}" title="כנסת ${k.k}"></i>`).join("");
  };
  [r0,r1].forEach(r=>{r.addEventListener("input",upd);
    r.addEventListener("change",()=>{upd(); render();});});
  upd();
}
const fmt=d=>d?d.split("-").reverse().join("."):"";

/* ─────────── בוררים ─────────── */
let pickCb=null;
function openPick(title,items,cb){
  pickCb=cb; $("#psearch").value=""; $("#psearch").placeholder=title;
  const draw=f=>{
    const s=(f||"").trim();
    $("#plist").innerHTML=items.filter(i=>!s||i.label.includes(s))
      .slice(0,400).map((i,n)=>
      `<button data-v="${i.value??""}">${i.label}${i.note?
        ` <small>${i.note}</small>`:""}</button>`).join("");
    $$("#plist button").forEach(b=>b.onclick=()=>{
      pickCb(b.dataset.v||null); closePick();});
  };
  draw(""); $("#psearch").oninput=e=>draw(e.target.value);
  $("#pick").classList.add("open"); $("#psearch").focus();
}
const closePick=()=>$("#pick").classList.remove("open");
function setupPickers(){
  $("#pclose").onclick=closePick;
  $("#s-fac").onclick=()=>{
    const seen=new Set(), it=[{label:"כל הסיעות",value:""}];
    FACS.forEach(f=>{if(!seen.has(f.f)){seen.add(f.f);
      it.push({label:f.f,value:f.f,note:`כנסת ${f.k}`});}});
    openPick("סיעה",it,v=>{S.faction=v; $("#s-fac").textContent=v||"כל הסיעות"; render();});
  };
  $("#s-top").onclick=()=>{
    const it=[{label:"כל הנושאים",value:""}].concat(
      TOPS.map(t=>({label:t.f,value:t.f,note:t.n.toLocaleString()+" הצבעות"})));
    openPick("נושא",it,v=>{S.topic=v; $("#s-top").textContent=v||"כל הנושאים"; render();});
  };
}
function setupNav(){
  $$("nav button").forEach(b=>b.onclick=()=>{
    $$("nav button").forEach(x=>x.setAttribute("aria-selected","false"));
    b.setAttribute("aria-selected","true"); S.tab=b.dataset.t;
    S.sort=SORTS[S.tab]||"n"; render();});
  $("#sort").onchange=e=>{S.sort=SORTS[S.tab]=e.target.value; render();};
  addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet(); closePick();}});
}

/* ─────────── שאילתות ─────────── */
const topicFilter=()=>S.topic
  ? `AND v.vote_id IN (SELECT ref_id FROM topic_match WHERE kind='vote'
       AND topic_id=(SELECT id FROM topic WHERE name='${S.topic.replace(/'/g,"''")}'))`
  : "";
const dateFilter=()=>`AND v.date BETWEEN '${S.d0}' AND '${S.d1}'`;

/* ─────────── תצוגה ─────────── */
function render(){
  const o=$("#out");
  $("#sort").innerHTML={
    answer:`<option value="n">מיון: מספר הצבעות</option>
            <option value="f">מיון: אחוז בעד</option>`,
    votes:`<option value="d">מיון: מהחדש לישן</option>
           <option value="g">מיון: הכי צמוד</option>`,
    people:`<option value="n">מיון: שם</option>
            <option value="v">מיון: הצבעות</option>`,
    cand:`<option value="p">מיון: לפי רשימה</option>
          <option value="k">מיון: בעלי רקורד תחילה</option>`,
    basket:`<option value="m">מיון: הכי הרבה הצבעות רלוונטיות</option>
            <option value="a">מיון: הכי מסכים איתך</option>`,
    snap:`<option value="r">מיון: לפי מספר מכהנים</option>
          <option value="n">מיון: לפי גודל הרשימה</option>`}[S.tab];
  // מיון תקף לטאב הנוכחי בלבד; אחרת נופל לברירת המחדל שלו
  const opts=[...$("#sort").options].map(o=>o.value);
  if(!opts.includes(S.sort)) S.sort=opts[0];
  $("#sort").value=S.sort;
  ({answer:renderAnswer,votes:renderVotes,basket:renderBasket,
    people:renderPeople,cand:renderCand,snap:renderSnap})[S.tab](o);
}

function renderAnswer(o){
  const rows=q(`SELECT m.faction f, m.bloc bl,
      SUM(r.result=1) yes, SUM(r.result=2) no,
      SUM(r.result=3) abs, SUM(r.result NOT IN (1,2,3)) oth
    FROM vote_result r JOIN vote_x v ON v.vote_id=r.vote_id
    JOIN mk m ON m.mk_id=r.mk_id
    WHERE 1=1 ${dateFilter()} ${topicFilter()}
      ${S.faction?`AND m.faction='${S.faction.replace(/'/g,"''")}'`:""}
    GROUP BY m.faction HAVING yes+no+abs>0`);
  const nv=one(`SELECT COUNT(*) FROM vote_x v WHERE 1=1 ${dateFilter()} ${topicFilter()}`);
  $("#count").textContent=`${nv.toLocaleString()} הצבעות בטווח`;
  $("#hint").textContent=S.topic
    ? `הנושא נקבע לפי מילות מפתח בכותרת הרשמית של ההצבעה.`
    : `בחרי נושא כדי לצמצם, או גררי את ציר הזמן.`;
  if(!rows.length) return o.innerHTML=
    `<div class="msg">אין הצבעות שעונות על הסינון.<br>נסי טווח רחב יותר או נושא אחר.</div>`;
  rows.sort((a,b)=>S.sort==="f"
    ? b.yes/(b.yes+b.no||1)-a.yes/(a.yes+a.no||1)
    : (b.yes+b.no+b.abs)-(a.yes+a.no+a.abs));
  o.innerHTML=`<div class="legend">
    <span><b style="background:var(--for)"></b>בעד</span>
    <span><b style="background:var(--against)"></b>נגד</span>
    <span><b style="background:var(--abstain)"></b>נמנע</span>
    <span><b style="background:var(--none)"></b>אחר</span></div>`
   +rows.map(r=>{
    const t=r.yes+r.no+r.abs+r.oth, p=x=>x/t*100;
    return `<div class="fac">
      <div class="top"><span class="nm">${r.f}</span>
        <span class="pill ${r.bl==="coalition"?"co":"op"}">${
          r.bl==="coalition"?"קואליציה":"אופוזיציה"}</span></div>
      <div class="split">
        ${r.yes?`<i class="f" style="width:${p(r.yes)}%"><span>${r.yes}</span></i>`:""}
        ${r.no?`<i class="a" style="width:${p(r.no)}%"><span>${r.no}</span></i>`:""}
        ${r.abs?`<i class="b" style="width:${p(r.abs)}%"></i>`:""}
        ${r.oth?`<i class="o" style="width:${p(r.oth)}%"></i>`:""}
      </div>
      <div class="tot" style="margin-top:7px">${t.toLocaleString()} הצבעות ·
        ${Math.round(r.yes/(r.yes+r.no||1)*100)}% בעד מתוך המכריעות</div>
    </div>`}).join("");
}

function renderVotes(o){
  const ord=S.sort==="g"
    ? "ABS(v.n_for-v.n_against) ASC, v.date DESC" : "v.date DESC";
  const rows=q(`SELECT v.vote_id id, v.title t, v.date d, v.knesset k,
      v.n_for f, v.n_against a, v.no_confidence nc
      (SELECT b.summary FROM vote_bill b WHERE b.vote_id=v.vote_id) sm
    FROM vote_x v WHERE v.title IS NOT NULL ${dateFilter()} ${topicFilter()}
    ${S.faction?`AND v.vote_id IN (SELECT r.vote_id FROM vote_result r
       JOIN mk m ON m.mk_id=r.mk_id WHERE m.faction='${S.faction.replace(/'/g,"''")}')`:""}
    ORDER BY ${ord} LIMIT 300`);
  $("#count").textContent=`${rows.length} הצבעות מוצגות`;
  if(!rows.length) return o.innerHTML=`<div class="msg">אין הצבעות בטווח.</div>`;
  o.innerHTML=rows.map(r=>`<div class="item" style="display:flex;gap:10px">
    <button class="add ${inBasket(r.id)?"on":""}" data-add="${r.id}"
      title="הוספה לסל">${inBasket(r.id)?"✓":"+"}</button>
    <button style="flex:1;text-align:start" data-v="${r.id}">
    <div class="t">${r.t}</div>
    ${r.sm?`<div style="font-size:12.5px;color:var(--dim);line-height:1.5;
      margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;
      -webkit-box-orient:vertical;overflow:hidden">${r.sm}</div>`:""}
    <div class="s"><span>${fmt(r.d)}</span><span>·</span><span>כנסת ${r.k}</span>
      ${r.nc?'<span class="pill">אי־אמון</span>':""}
      <span class="pill f">${r.f} בעד</span><span class="pill a">${r.a} נגד</span></div>
    <div class="bar"><i class="f" style="width:${r.f/(r.f+r.a||1)*100}%"></i>
      <i class="a" style="flex:1"></i></div>
    </button></div>`).join("");
  $$("#out [data-v]").forEach(b=>b.onclick=()=>openVote(+b.dataset.v));
  $$("#out [data-add]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); toggleBasket(+b.dataset.add);});
}

function renderPeople(o){
  // ספירה מצטברת אחת במקום תת-שאילתה לכל ח"כ — 1.9 שניות מול 0.2
  const rows=q(`WITH cnt AS (
      SELECT r.mk_id, COUNT(*) nv FROM vote_result r
      JOIN vote_x v ON v.vote_id=r.vote_id
      WHERE 1=1 ${dateFilter()} ${topicFilter()} GROUP BY r.mk_id)
    SELECT m.mk_id id, m.person_id pid, m.name nm, m.faction f,
      m.bloc bl, m.knesset k, m.is_faction_chair ch,
      COALESCE(c.nv,0) nv
    FROM mk m LEFT JOIN cnt c ON c.mk_id=m.mk_id
    WHERE m.knesset IN (SELECT DISTINCT knesset FROM vote_x)
      ${S.faction?`AND m.faction='${S.faction.replace(/'/g,"''")}'`:""}
    ORDER BY ${S.sort==="v"?"nv DESC":"m.name"} LIMIT 400`);
  $("#count").textContent=`${rows.length} ח״כים`;
  o.innerHTML=rows.map(r=>`<button class="item" data-p="${r.pid}" data-m="${r.id}">
    <div class="t">${r.nm}</div>
    <div class="s"><span>${r.f}</span>
      <span class="pill ${r.bl==="coalition"?"co":"op"}">${
        r.bl==="coalition"?"קואליציה":"אופוזיציה"}</span>
      <span>כנסת ${r.k}</span>${r.ch?'<span class="pill">יו״ר סיעה</span>':""}
      <span>· ${r.nv.toLocaleString()} הצבעות בטווח</span></div>
  </button>`).join("");
  $$("#out .item").forEach(b=>b.onclick=()=>openPerson(+b.dataset.p,+b.dataset.m));
}

    (b.verified==="knesset")-(a.verified==="knesset"));

  rows.forEach(r=>(byList[r.list]??=[]).push(r));
  $("#count").textContent=`${rows.length} מועמדים · ${Object.keys(byList).length} רשימות`;
  o.innerHTML=`<div class="legend" style="padding-bottom:10px">${CAND.note||""}</div>`
   +Object.entries(byList).map(([l,arr])=>
    `<div class="sec"><h3>${l}</h3>${arr.map(r=>`
      <button class="item" style="padding-inline:0;border:0"
        data-c="${encodeURIComponent(r.name)}">
        <div class="t">${r.pos?`<span class="n" style="color:var(--dim)">${r.pos}.</span> `:""}${r.name}</div>
        <div class="s">${
          r.verified==="knesset"?'<span class="pill co">רקורד בכנסת</span>':
          r.verified==="wikipedia"?'<span class="pill">ויקיפדיה</span>':
          '<span class="pill">ללא מקור</span>'}
          ${r.knessets?`<span>כנסת ${r.knessets.slice(0,4).join(", ")}</span>`:""}
          ${r.wiki&&r.wiki.cats&&r.wiki.cats.length?
            `<span>${r.wiki.cats.slice(0,2).join(" · ")}</span>`:""}</div>
      </button>`).join("")}</div>`).join("");

    openCand(decodeURIComponent(b.dataset.c)));
}

function renderBasket(o){
  $("#count").textContent=`${BASKET.length} חוקים בסל`;
  if(!BASKET.length) return o.innerHTML=`<div class="msg">
    הסל ריק.<br><br>עברי ללשונית <b>הצבעות</b>, מצאי את החוקים שחשובים לך
    — אפשר לסנן לפי נושא ולגרור את ציר הזמן — והוסיפי אותם בכפתור <b>+</b>.
    <br><br>אחר כך סמני מה העמדה שלך בכל אחד, ותראי מי הצביע כמוך.</div>`;
  const ph=BASKET.map(()=>"?").join(",");
  const votes=q(`SELECT v.vote_id id, v.title t, v.date d,
      (SELECT b.summary FROM vote_bill b WHERE b.vote_id=v.vote_id) sm
    FROM vote_x v WHERE v.vote_id IN (${ph})`,BASKET);
  const rows=q(`SELECT r.mk_id, r.vote_id, r.result, m.name, m.faction, m.bloc,
      m.person_id FROM vote_result r JOIN mk m ON m.mk_id=r.mk_id
    WHERE r.vote_id IN (${ph})`,BASKET);
  const marked=BASKET.filter(id=>STANCE[id]);

  const byMk={};
  rows.forEach(r=>{
    (byMk[r.mk_id] ??= {nm:r.name,f:r.faction,bl:r.bloc,pid:r.person_id,v:{}})
      .v[r.vote_id]=r.result;});
  const list=Object.entries(byMk).map(([mk,d])=>{
    let agree=0,dis=0;
    marked.forEach(id=>{const g=d.v[id];
      if(g===1||g===2){ (g===STANCE[id]) ? agree++ : dis++; }});
    return {mk:+mk,...d,agree,dis,seen:marked.filter(id=>d.v[id]).length};
  }).filter(x=>x.seen>0);

  const sorted=S.sort==="a"
    ? list.sort((a,b)=>b.agree/(b.agree+b.dis||1)-a.agree/(a.agree+a.dis||1))
    : list.sort((a,b)=>b.seen-a.seen);

  o.innerHTML=`<div class="sec"><h3>החוקים שבחרת</h3>${votes.map(v=>`
     <div style="border-bottom:1px solid var(--rule-2);padding-bottom:12px;
       margin-bottom:12px">
       <div style="display:flex;gap:10px">
         <button class="add on" data-rm="${v.id}">✓</button>
         <div style="flex:1">
           <div style="font-size:14px;line-height:1.4">${v.t}</div>
           ${v.sm?`<div style="font-size:12px;color:var(--dim);margin-top:4px;
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
             overflow:hidden">${v.sm}</div>`:""}
           <div class="stance">
             <button class="f ${STANCE[v.id]===1?"on":""}" data-st="${v.id}" data-p="1">אני בעד</button>
             <button class="a ${STANCE[v.id]===2?"on":""}" data-st="${v.id}" data-p="2">אני נגד</button>
           </div>
         </div></div></div>`).join("")}</div>
   ${marked.length?`<div class="sec"><h3>מי הצביע כמוך · ${marked.length} מתוך ${BASKET.length} סומנו</h3>
     ${sorted.slice(0,80).map(x=>{
       const t=x.agree+x.dis||1, p=Math.round(x.agree/t*100);
       return `<button class="item" style="padding-inline:0;border-bottom:1px solid var(--rule-2)"
         data-p2="${x.pid}" data-m2="${x.mk}">
         <div class="score"><span style="flex:1;font-size:14.5px">${x.nm}
           <span style="color:var(--dim);font-size:12px">${x.f}</span></span>
           <span class="n" style="color:${p>=60?"var(--for)":p<=40?"var(--against)":"var(--dim)"}">${p}%</span></div>
         <div class="mini">${BASKET.map(id=>{
           const g=x.v[id], cls=g===1?"f":g===2?"a":g===3?"b":"";
           return `<i class="${cls}" title="${g===1?"בעד":g===2?"נגד":g===3?"נמנע":"לא הצביע"}"></i>`;
         }).join("")}</div>
         <div style="font-size:11.5px;color:var(--dim);margin-top:5px">
           ${x.agree} כמוך · ${x.dis} הפוך · הצביע ב-${x.seen} מתוך ${BASKET.length}</div>
       </button>`}).join("")}</div>`
    :`<div class="msg">סמני <b>אני בעד</b> או <b>אני נגד</b> בכל חוק,
        ואחשב מי הצביע כמוך.</div>`}`;
  $$("#out [data-rm]").forEach(b=>b.onclick=()=>toggleBasket(+b.dataset.rm));
  $$("#out [data-st]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.st, p=+b.dataset.p;
    STANCE[id]===p ? delete STANCE[id] : STANCE[id]=p;
    saveBasket(); render();});
  $$("#out [data-p2]").forEach(b=>b.onclick=()=>
    openPerson(+b.dataset.p2,+b.dataset.m2));
}

function renderSnap(o){
  if(!CAND) return o.innerHTML=`<div class="msg">candidates.json לא נטען.</div>`;
  const withRec=CAND.rows.filter(r=>r.person_id);
  const pids=[...new Set(withRec.map(r=>r.person_id))];
  if(!pids.length) return o.innerHTML=`<div class="msg">אין מועמדים עם רקורד.</div>`;
  const ph=pids.map(()=>"?").join(",");
  const rec={}; pids.forEach(p=>rec[p]={f:0,a:0,tot:0,bills:0,passed:0,chair:0,cmt:0,kn:[]});
  q(`SELECT m.person_id p, m.knesset k,
       SUM(CASE WHEN r.result=1 THEN 1 ELSE 0 END) f,
       SUM(CASE WHEN r.result=2 THEN 1 ELSE 0 END) a, COUNT(r.vote_id) tot
     FROM mk m LEFT JOIN vote_result r ON r.mk_id=m.mk_id
     WHERE m.person_id IN (${ph}) GROUP BY m.mk_id`,pids)
   .forEach(x=>{const d=rec[x.p]; if(!d)return;
     d.f+=x.f||0; d.a+=x.a||0; d.tot+=x.tot||0; if(x.k)d.kn.push(x.k);});
  q(`SELECT bi.PersonID p, COUNT(*) n, SUM(b.StatusID=118) ps
     FROM kns_billinitiator bi JOIN kns_bill b ON b.Id=bi.BillID
     WHERE bi.PersonID IN (${ph}) GROUP BY 1`,pids)
   .forEach(x=>{if(rec[x.p]){rec[x.p].bills=x.n; rec[x.p].passed=x.ps||0;}});
  q(`SELECT m.person_id p, SUM(c.role='יו"ר') ch, COUNT(*) n
     FROM mk_committee c JOIN mk m ON m.mk_id=c.mk_id
     WHERE m.person_id IN (${ph}) GROUP BY 1`,pids)
   .forEach(x=>{if(rec[x.p]){rec[x.p].chair=x.ch||0; rec[x.p].cmt=x.n||0;}});

  const byList={};
  CAND.rows.filter(r=>r.name).forEach(r=>(byList[r.list] ??= []).push(r));
  const lists=Object.entries(byList).map(([l,arr])=>{
    const rs=arr.filter(r=>r.person_id).map(r=>rec[r.person_id]).filter(Boolean);
    return {l,arr,n:arr.length,exp:rs.length,
      bills:rs.reduce((s,x)=>s+x.bills,0),
      passed:rs.reduce((s,x)=>s+x.passed,0),
      chair:rs.reduce((s,x)=>s+x.chair,0),
      votes:rs.reduce((s,x)=>s+x.tot,0)};
  }).sort((a,b)=>S.sort==="n"?b.n-a.n:b.exp-a.exp);

  $("#count").textContent=`${lists.length} רשימות · ${withRec.length} מתוכם עם רקורד`;
  o.innerHTML=`<div class="legend" style="padding-bottom:12px">
     מה שהאנשים שרצים היום עשו בכנסת. הרשימות מקורן בדיווח ולא בוועדת
     הבחירות — ${CAND.fetched||""}.</div>`
   +lists.map(L=>`<div class="sec"><h3>${L.l}</h3>
     <div class="grid" style="margin-bottom:12px">
       <div class="cell"><div class="v n">${L.n}</div><div class="k">מועמדים</div></div>
       <div class="cell"><div class="v n">${L.exp}</div><div class="k">כיהנו בעבר</div></div>
       <div class="cell"><div class="v n">${L.bills.toLocaleString()}</div><div class="k">הצעות חוק שיזמו</div></div>
       <div class="cell"><div class="v n">${L.chair}</div><div class="k">כהונות כיו״ר ועדה</div></div>
     </div>
     ${L.arr.map(r=>{
       const d=r.person_id?rec[r.person_id]:null;
       return `<button class="item" style="padding-inline:0;border-bottom:1px solid var(--rule-2)"
         data-c2="${encodeURIComponent(r.name)}">
         <div class="t">${r.pos?`<span class="n" style="color:var(--dim)">${r.pos}.</span> `:""}${r.name}</div>
         <div class="s">${d?
           `<span class="pill co">כנסת ${[...new Set(d.kn)].sort((x,y)=>y-x).slice(0,3).join(", ")}</span>
            <span>${d.tot.toLocaleString()} הצבעות</span>
            ${d.bills?`<span>· ${d.bills} הצעות חוק</span>`:""}
            ${d.passed?`<span>(${d.passed} עברו)</span>`:""}
            ${d.chair?`<span>· יו״ר ${d.chair} ועדות</span>`:""}`
           :r.verified==="wikipedia"?`<span class="pill">ללא רקורד בכנסת · יש ערך בוויקיפדיה</span>`
           :`<span class="pill">ללא רקורד וללא מקור</span>`}</div>
       </button>`}).join("")}
   </div>`).join("");
  $$("#out [data-c2]").forEach(b=>b.onclick=()=>
    openCand(decodeURIComponent(b.dataset.c2)));
}

/* ─────────── גיליונות ─────────── */
const openSheet=h=>{$("#sheetin").innerHTML=h; $("#sheet").classList.add("open");
  $("#sheet").scrollTop=0; document.body.style.overflow="hidden";
  $("#sheetin .x").onclick=closeSheet;
  const va=$("#vadd"); if(va) va.onclick=()=>{toggleBasket(+va.dataset.id||CURVOTE);
    closeSheet();};};
let CURVOTE=null;
const closeSheet=()=>{$("#sheet").classList.remove("open");
  document.body.style.overflow="";};

function openVote(id){
  CURVOTE=id;
  const v=q(`SELECT * FROM vote_x WHERE vote_id=?`,[id])[0];
  const fv=q(`SELECT m.faction f, m.bloc bl, SUM(r.result=1) yes,
      SUM(r.result=2) no, SUM(r.result=3) ab
    FROM vote_result r JOIN mk m ON m.mk_id=r.mk_id
    WHERE r.vote_id=? GROUP BY m.faction ORDER BY yes+no DESC`,[id]);
  const who=r=>q(`SELECT m.name nm, m.faction f FROM vote_result r
    JOIN mk m ON m.mk_id=r.mk_id WHERE r.vote_id=? AND r.result=? ORDER BY m.faction`,
    [id,r]);
  const tops=q(`SELECT t.name n, m.keyword k FROM topic_match m
    JOIN topic t ON t.id=m.topic_id WHERE m.kind='vote' AND m.ref_id=?`,[id]);
  const bill=(q(`SELECT b.*, s.name st FROM vote_bill b
    LEFT JOIN status s ON s.id=b.status WHERE b.vote_id=?`,[id])||[])[0];
  // מוצג תמיד, גם כשריק. השמטה לא מבדילה בין "אף אחד" לבין "חסר נתון".
  const list=(t,arr,cls)=>`<div class="sec"><h3>${t} · ${arr.length}</h3>
    ${arr.length?`<div class="txt">${arr.map(x=>
      `<span style="color:var(--${cls})">${x.nm}</span>
       <span style="color:var(--dim);font-size:12px">${x.f}</span>`).join(" · ")}</div>`
     :`<div style="color:var(--dim);font-size:13px">אף אחד לא הצביע ${t}.</div>`}
    </div>`;
  openSheet(`<div class="hd"><button class="x">✕</button><b>הצבעה</b>
   <button class="add ${inBasket(id)?"on":""}" id="vadd">${inBasket(id)?"✓":"+"}</button></div>
   <div class="sec"><div style="font:400 19px/1.5 'Frank Ruhl Libre',serif">${
     v.title||"(ללא כותרת)"}</div>
     <div class="s" style="margin-top:10px;font-size:12px;color:var(--dim)">
       ${fmt(v.date)} · כנסת ${v.knesset}${v.no_confidence?" · הצעת אי־אמון":""}</div>
     ${bill?`<div class="sec" style="padding-inline:0;border:0;padding-bottom:0">
       <h3>על מה ההצבעה</h3>
       <div style="font-size:14px;line-height:1.5">${bill.bill_name}</div>
       <div style="font-size:11.5px;color:var(--dim);margin-top:5px">
         ${bill.kind||""}${bill.st?` · ${bill.st}`:""}</div>
       ${bill.summary?`<div class="txt" style="margin-top:11px">${bill.summary}</div>`
         :`<div class="note" style="margin-top:9px">לחוק הזה אין תקציר רשמי במאגר.
            שם ההצעה למעלה הוא מה שקיים.</div>`}
     </div>`:`<div class="note" style="margin-top:10px">ההצבעה אינה מקושרת
        להצעת חוק — ייתכן שהיא נוגעת לסדר היום או לנוהל.</div>`}
     ${tops.length?`<div style="margin-top:14px">${tops.map(t=>
       `<span class="pill" style="margin-inline-end:5px">${t.n}${
         t.k?` <span style="color:var(--none)">«${t.k}»</span>`:""}</span>`).join("")}</div>`:""}
   </div>
   <div class="sec"><h3>לפי סיעה</h3>${fv.map(r=>{
     const t=r.yes+r.no+r.ab||1;
     return `<div style="margin-bottom:11px">
       <div style="display:flex;font-size:13px"><span style="flex:1">${r.f}</span>
         <span class="n" style="color:var(--dim);font-size:11.5px">${r.yes} בעד · ${r.no} נגד${
           r.ab?` · ${r.ab} נמנע`:""}</span></div>
       <div class="split" style="height:14px;margin-top:5px">
         ${r.yes?`<i class="f" style="width:${r.yes/t*100}%"></i>`:""}
         ${r.no?`<i class="a" style="width:${r.no/t*100}%"></i>`:""}
         ${r.ab?`<i class="b" style="width:${r.ab/t*100}%"></i>`:""}</div></div>`;
     }).join("")}</div>
   ${list("בעד",who(1),"for")}${list("נגד",who(2),"against")}
   ${list("נמנעו",who(3),"abstain")}
   <div class="sec"><div class="note">מקור: KNS_PlenumVote ו-VoteResults.
     כל שורה כאן היא רשומה רשמית של הכנסת.</div></div>`);
}

async function openPerson(pid,mkid){
  const m=q(`SELECT * FROM mk WHERE mk_id=?`,[mkid])[0];
  const roles=q(`SELECT title,org,start,finish,kind FROM mk_role WHERE mk_id=?
    ORDER BY start DESC`,[mkid]);
  const cms=q(`SELECT committee,role,start,finish FROM mk_committee WHERE mk_id=?
    ORDER BY role='יו"ר' DESC`,[mkid]);
  const v=q(`SELECT SUM(r.result=1) f,SUM(r.result=2) a,SUM(r.result=3) b,
      COUNT(*) t FROM vote_result r JOIN vote_x vv ON vv.vote_id=r.vote_id
      WHERE r.mk_id=? ${dateFilter().replace(/v\./g,"vv.")}`,[mkid])[0]||{};
  const bills=one(`SELECT COUNT(*) FROM kns_billinitiator WHERE PersonID=?`,[pid])||0;
  const tps=q(`SELECT t.name n,k.v_for f,k.v_against a,k.bills b
    FROM mk_topic k JOIN topic t ON t.id=k.topic_id
    WHERE k.mk_id=? ORDER BY k.v_for+k.v_against DESC LIMIT 8`,[mkid]);
  let hist=null;
  try{hist=await (await fetch(`history/${pid}.json`)).json();}catch(e){}
  const cand=CAND&&CAND.rows.find(r=>r.person_id===pid);
  openSheet(`<div class="hd"><button class="x">✕</button><b>${m.name}</b></div>
   <div class="hero"><div class="face">${m.name.split(" ").map(w=>w[0]).join("").slice(0,2)}</div>
     <div><h2>${m.name}</h2>
       <div class="sub">${m.faction} · כנסת ${m.knesset}<br>${
         m.bloc==="coalition"?"קואליציה":"אופוזיציה"}${
         m.is_faction_chair?" · יו״ר סיעה":""}${
         cand?`<br><span style="color:var(--sky)">מתמודד/ת ברשימת ${cand.list}${
           cand.pos?`, מקום ${cand.pos}`:""}</span>`:""}</div>
       <div class="lnks">${m.url?`<a href="${m.url}" target="_blank">דף באתר הכנסת</a>`:""}
         ${m.odata?`<a href="${m.odata}" target="_blank">הרשומה הגולמית</a>`:""}</div>
     </div></div>
   <div class="sec"><h3>הצבעות בטווח שנבחר</h3><div class="grid">
     <div class="cell"><div class="v n">${(v.f||0).toLocaleString()}</div><div class="k">בעד</div></div>
     <div class="cell"><div class="v n">${(v.a||0).toLocaleString()}</div><div class="k">נגד</div></div>
     <div class="cell"><div class="v n">${(v.b||0).toLocaleString()}</div><div class="k">נמנע</div></div>
     <div class="cell"><div class="v n">${bills.toLocaleString()}</div><div class="k">הצעות חוק שיזם/ה</div></div>
   </div><div class="note">${fmt(S.d0)} – ${fmt(S.d1)}</div></div>
   ${tps.length?`<div class="sec"><h3>לפי נושא</h3>${tps.map(t=>`
     <div style="margin-bottom:10px">
       <div style="display:flex;font-size:13.5px"><span style="flex:1">${t.n}</span>
         <span class="n" style="color:var(--dim);font-size:12px">${t.f} בעד · ${t.a} נגד${
           t.b?` · ${t.b} יזם`:""}</span></div>
       <div class="bar"><i class="f" style="width:${t.f/(t.f+t.a||1)*100}%"></i>
         <i class="a" style="flex:1"></i></div></div>`).join("")}</div>`:""}
   ${cms.length?`<div class="sec"><h3>ועדות</h3>${cms.map(c=>
     `<div class="item" style="padding-inline:0;border-bottom:1px solid var(--rule-2)">
       <div class="t">${c.committee||"—"}</div>
       <div class="s"><span class="pill${c.role==='יו"ר'?" co":""}">${c.role}</span>
         <span>${fmt(c.start)}${c.finish?" – "+fmt(c.finish):""}</span></div></div>`
     ).join("")}</div>`:""}
   ${roles.length?`<div class="sec"><h3>תפקידים</h3><div class="tl">${
     roles.slice(0,20).map(r=>`<div><div class="w">${r.title}</div>
       <div class="d">${r.org} · ${fmt(r.start)}${r.finish?" – "+fmt(r.finish):""}</div>
     </div>`).join("")}</div></div>`:""}
   ${hist&&hist.knessets.length>1?`<div class="sec"><h3>מסלול מלא</h3><div class="tl">${
     hist.knessets.map(k=>`<div><div class="w">${k.faction}</div>
       <div class="d">כנסת ${k.k}${k.from?" · "+fmt(k.from):""}</div></div>`).join("")
     }</div><div class="note">מתוך history/${pid}.json — כל הקדנציות, גם מחוץ לטווח.</div></div>`:""}
   <div class="sec"><div class="note">כל השדות נגזרים מרשומות רשמיות של הכנסת.
     אין כאן דירוג, ציון או פרשנות — ספירה ותאריכים בלבד.</div></div>`);
}

function openCand(name){
  const r=CAND.rows.find(x=>x.name===name);
  if(!r) return;
  if(r.person_id) return openPerson(r.person_id,
    one("SELECT mk_id FROM mk WHERE person_id=? ORDER BY knesset DESC LIMIT 1",
        [r.person_id]));
  const w=r.wiki;
  openSheet(`<div class="hd"><button class="x">✕</button><b>${r.name}</b></div>
   <div class="hero">${w&&w.img?`<img class="face" src="${w.img}" alt="">`:
     `<div class="face">${r.name.split(" ").map(x=>x[0]).join("").slice(0,2)}</div>`}
     <div><h2>${r.name}</h2>
       <div class="sub">${r.list}${r.pos?` · מקום ${r.pos}`:""}<br>
         ${w?"מידע מוויקיפדיה":"לא נמצא מקור מידע"}${
         w&&w.born?` · נולד/ה ${w.born}`:""}</div>
       <div class="lnks">${w&&w.url?`<a href="${w.url}" target="_blank">הערך בוויקיפדיה</a>`:""}</div>
     </div></div>
   ${w?`<div class="sec"><h3>רקע</h3><div class="txt">${w.summary}</div></div>
     ${w.cats&&w.cats.length?`<div class="sec"><h3>שיוכים</h3>
       <div>${w.cats.map(c=>`<span class="pill" style="margin:0 0 6px 6px;display:inline-block">${c}</span>`).join("")}</div></div>`:""}`
    :`<div class="msg">לא נמצא ערך בוויקיפדיה ואין רקורד בכנסת.<br>
        ייתכן שאלה פנים חדשות לגמרי, וייתכן שהשם ברשימה שגוי.</div>`}
   <div class="sec"><div class="note">אין לאדם זה רקורד פרלמנטרי במאגר —
     כלומר לא כיהן בכנסת ה-22 עד ה-25. הרשימות עצמן מקורן בדיווח ולא
     בוועדת הבחירות, עד להגשה הרשמית.</div></div>`);
}

boot();
</script>
</body>
</html>
